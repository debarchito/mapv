[project]
name = "metrics-calc"
version = "0.1.0"
description = "metrics-calc"
authors = [{ name = "Debarchito Nath", email = "debarchiton@proton.me" }]
keywords = ["metrics-calc"]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "seaborn>=0.13.2",
]

[project.scripts]
metrics-calc = "metrics_calc.__main__:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Linux"
executionEnvironments = [
  { root = "src" },
  { root = "test", extraPaths = [
    "src",
  ] },
]
